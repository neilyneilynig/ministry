<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2f4a3a">
<title>The Ministry · Clerk Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Fredoka:wght@400;500;600;700&family=Gochi+Hand&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--wall:#2f4a3a;--wall2:#253b2e;--paper:#f6ecd2;--paper2:#eadcb5;--ink:#2b2118;--red:#c8323c;--green:#2e8b57;--gold:#f3a712;--teal:#29a19c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--paper);background:linear-gradient(var(--wall),var(--wall2));background-attachment:fixed;display:flex;flex-direction:column;overscroll-behavior:none}
.slab{font-family:'Alfa Slab One',serif}
.type{font-family:'Special Elite',monospace}
#bar{height:6px;background:rgba(0,0,0,.3)}
#bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.25);min-height:50px}
#top .who{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .cash{font-family:'Alfa Slab One';background:var(--paper);color:var(--green);border-radius:10px;padding:2px 10px;font-size:18px}
#top .cash.neg{color:var(--red)}
#main{flex:1;display:flex;flex-direction:column;padding:12px 14px 14px;gap:12px;min-height:0;overflow-y:auto}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
h1{font-family:'Alfa Slab One';font-size:40px;line-height:.95;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 b{color:var(--gold);font-weight:400}
h2{font-family:'Alfa Slab One';font-size:24px;font-weight:400;line-height:1.1}
p{font-size:17px;opacity:.9;line-height:1.35}
.bigE{font-size:84px;line-height:1}
button,input{font-family:inherit}
button{cursor:pointer;border:none}
.btn{background:var(--red);color:#fff;font-family:'Alfa Slab One';font-size:20px;border-radius:14px;padding:15px;box-shadow:0 5px 0 #8a1f27;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a1f27}
.btn.g{background:var(--green);box-shadow:0 5px 0 #1d5c39}
.btn:disabled{opacity:.45}
input{width:100%;font-size:22px;padding:14px 16px;border-radius:12px;border:3px solid transparent;outline:none;color:var(--ink);background:var(--paper)}
input:focus{border-color:var(--gold)}
.join{display:flex;flex-direction:column;gap:14px;margin:auto 0}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avs button{font-size:32px;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 0;border:3px solid transparent}
.avs button.sel{border-color:var(--gold);background:rgba(243,167,18,.25)}
.avs button:disabled{opacity:.2}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}

/* scanners */
.scanbox{margin-top:10px;border-top:2px dashed rgba(43,33,24,.35);padding-top:6px}
.scanrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.scanrow button{background:#2b2118;color:var(--paper);border-radius:8px;padding:8px 4px;font-family:Fredoka;font-weight:600;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.scanrow button:active{transform:translateY(2px);box-shadow:none}
.readout{background:#e3f4ee;border:2px solid #29a19c;border-radius:8px;padding:5px 7px;font-size:13px;line-height:1.25;animation:pop .25s ease-out}
.readout b{font-size:14px}
.readout.alarm{background:#fde2e2;border-color:var(--red)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.beam{position:absolute;inset:0;border-radius:6px;pointer-events:none;overflow:hidden;z-index:5}
.beam::before{content:'';position:absolute;left:0;right:0;height:38px;top:-40px;background:linear-gradient(transparent,var(--bc),transparent);animation:sweep var(--bd) linear}
.beam::after{content:attr(data-t);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Alfa Slab One';font-size:24px;color:var(--bc);text-shadow:0 2px 0 rgba(0,0,0,.4);background:var(--bt)}
.beam.uv{--bc:#b77bff;--bt:rgba(80,20,160,.28)}.beam.xray{--bc:#7ff3ff;--bt:rgba(0,30,60,.55)}.beam.id{--bc:#ffd36b;--bt:rgba(60,40,0,.2)}.beam.temp{--bc:#ff6b6b;--bt:rgba(120,0,0,.15)}
@keyframes sweep{to{top:100%}}

/* the form */
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:14px 14px 12px;box-shadow:0 6px 0 rgba(0,0,0,.3);position:relative;font-family:'Special Elite',monospace;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(41,161,156,.12) 23px 24px);animation:slide .3s ease-out}
@keyframes slide{from{transform:translateY(30px) rotate(2deg);opacity:0}}
.paper.out-approve{animation:outR .35s ease-in forwards}
.paper.out-deny{animation:outL .35s ease-in forwards}
@keyframes outR{to{transform:translateX(120%) rotate(12deg);opacity:0}}
@keyframes outL{to{transform:translateX(-120%) rotate(-12deg);opacity:0}}
.ph{display:flex;justify-content:space-between;font-size:11px;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px;letter-spacing:.05em}
.pat{height:6px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden;margin-bottom:10px}
.pat i{display:block;height:100%;width:100%;background:var(--green)}
.lbl{font-size:10px;letter-spacing:.12em;opacity:.6;margin-top:6px}
.app{display:flex;gap:10px;align-items:center}
.app .e{font-size:46px;line-height:1}
.app .v{font-size:19px;font-weight:700}
.app .t{font-size:13px;text-transform:uppercase}
.mood{display:inline-block;font-size:14px;margin-top:2px}
.req{font-size:20px;line-height:1.2;margin:2px 0 6px}
.ink-crayon{font-family:'Gochi Hand',cursive;font-size:24px;color:#d1495b}
.ink-glitter{background:linear-gradient(90deg,#ff5ea0,#f3a712,#29a19c,#9b5de5,#ff5ea0);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;animation:glit 2s linear infinite}
@keyframes glit{to{background-position:200%}}
.ink-pen{color:#1d3b8a}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{background:var(--ink);color:var(--paper);border-radius:5px;padding:2px 7px;font-size:13px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;font-size:14px;line-height:1.35}
.bad{color:var(--red);font-weight:700}
.bribe{margin-top:10px;background:#1f3d2a;color:#b7f7c5;border-radius:6px;padding:8px 10px;font-size:14px;transform:rotate(-1deg);border:2px dashed #b7f7c5}
.stampmark{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:'Alfa Slab One';font-size:46px;border:6px double;padding:0 14px;border-radius:10px;opacity:.82;animation:stampin .2s ease-out;mix-blend-mode:multiply;
  -webkit-mask-image:repeating-linear-gradient(-35deg,#000 0 3px,rgba(0,0,0,.55) 3px 5px),radial-gradient(circle,#000 60%,rgba(0,0,0,.6));mask-image:repeating-linear-gradient(-35deg,#000 0 3px,rgba(0,0,0,.55) 3px 5px)}
.photo{background:#fff;padding:5px 5px 3px;box-shadow:0 2px 5px rgba(0,0,0,.25);transform:rotate(-4deg);text-align:center;flex:none}
.photo .e{display:block;width:62px;height:62px;line-height:62px;background:linear-gradient(#cfe8f3,#a9d0e4);font-size:44px}
.photo small{display:block;font-size:8px;letter-spacing:.1em;margin-top:2px}
.stain{position:absolute;width:110px;height:110px;border-radius:50%;left:-30px;bottom:-30px;background:radial-gradient(circle,transparent 52%,rgba(120,72,30,.18) 55%,rgba(120,72,30,.08) 62%,transparent 66%);pointer-events:none;transform:rotate(20deg)}
.clip{position:absolute;top:-14px;right:24px;font-size:34px;transform:rotate(18deg);filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.paper.vip{background-color:#fff4c7;box-shadow:0 0 0 4px var(--gold),0 6px 0 rgba(0,0,0,.3)}
.vipribbon{background:linear-gradient(90deg,#f3a712,#ffd36b,#f3a712);color:var(--ink);font-family:'Alfa Slab One';font-size:13px;text-align:center;padding:4px;margin:-14px -14px 10px;border-radius:6px 6px 0 0;letter-spacing:.04em}
.quote{font-family:'Gochi Hand',cursive;font-size:19px;color:#5a3d2b;background:#fff;border-radius:14px;padding:6px 12px;margin:8px 0 2px;position:relative;display:inline-block;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.quote::before{content:'';position:absolute;top:-8px;left:22px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
.megabtn{margin-top:8px;background:var(--gold);color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:700;font-size:14px;font-family:Fredoka}
.decree{background:var(--gold);color:var(--ink);border-radius:10px;padding:8px 12px;font-family:'Special Elite';font-weight:700;font-size:14px;border:2px dashed var(--ink)}
.prankrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prankrow button{background:#5a2d6b;color:#fff;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:600}
#prank{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.25);touch-action:none}
#prank .lbl2{position:absolute;top:70px;left:0;right:0;text-align:center;font-family:'Alfa Slab One';font-size:22px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#prank button{position:absolute;font-size:54px;background:none;line-height:1;animation:wiggle .3s ease-in-out infinite alternate;transition:left .9s ease-in-out,top .9s ease-in-out}
@keyframes wiggle{to{transform:rotate(18deg) scale(1.08)}}
.toss{background:rgba(0,0,0,.25);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.track{position:relative;width:100%;height:34px;background:rgba(255,255,255,.12);border-radius:17px;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:rgba(46,139,87,.75)}
.track .mark{position:absolute;top:3px;width:28px;height:28px;margin-left:-14px;font-size:24px;line-height:28px;text-align:center}
.balls{font-size:26px;letter-spacing:4px}
#evbar{display:none;background:#6a4c93;color:#fff;text-align:center;font-family:'Alfa Slab One';font-size:15px;padding:7px 10px;letter-spacing:.03em}
.awardp{background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;width:100%}
.awardp b{display:block;font-family:'Alfa Slab One';font-size:17px}
.stampmark.approve{color:var(--green)}.stampmark.deny{color:var(--red)}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stamps button{font-family:'Alfa Slab One';font-size:22px;border-radius:14px;padding:16px 6px;color:#fff}
.stamps .ap{background:var(--green);box-shadow:0 5px 0 #1d5c39}
.stamps .dn{background:var(--red);box-shadow:0 5px 0 #8a1f27}
.stamps button:active{transform:translateY(4px);box-shadow:none}
.sendrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sendrow .l{width:100%;font-size:13px;opacity:.75;letter-spacing:.04em}
.sendrow button{flex:1 1 30%;background:rgba(255,255,255,.1);color:var(--paper);border-radius:12px;padding:8px 6px;font-size:15px;white-space:nowrap;border:2px solid rgba(255,255,255,.18);overflow:hidden;text-overflow:ellipsis}
.sendrow button:active{background:var(--gold);color:var(--ink)}
.queue{display:flex;gap:6px;align-items:center;font-size:14px;opacity:.85;flex-wrap:wrap;min-height:34px}
.card{background:rgba(0,0,0,.2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%}
.mini{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.mini .rule{font-size:14px;padding:9px 10px 9px 12px}
.hint{font-size:14px;opacity:.7}
.queue span{font-size:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.3)}
.tabs button{background:rgba(255,255,255,.08);color:var(--paper);border-radius:12px;padding:10px;font-size:16px;font-weight:600;position:relative}
.tabs button.on{background:var(--paper);color:var(--ink)}
.tabs .badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:13px}
.rule{background:var(--paper);color:var(--ink);border-radius:8px;padding:12px 12px 12px 14px;font-family:'Special Elite',monospace;font-size:16px;line-height:1.3;border-left:8px solid var(--k);position:relative}
.rule.deny{--k:var(--red)}.rule.allow{--k:var(--gold)}.rule.who{--k:#3d7dca}.rule.scan{--k:#9b5de5}
.rule .k{font-family:'Alfa Slab One';font-size:12px;letter-spacing:.06em;display:block;margin-bottom:3px;color:var(--k)}
.rule.new{animation:glow 1.2s ease-in-out 3}
.rule.new::after{content:'NEW';position:absolute;top:-8px;right:8px;background:var(--red);color:#fff;font-family:'Alfa Slab One';font-size:11px;padding:1px 6px;border-radius:5px}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--gold)}}
.rule.peek{opacity:.85;border-style:dashed}
.sec{font-family:'Alfa Slab One';font-size:15px;color:var(--gold);margin-top:4px}
.wear{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 12px;font-size:15px}
.wear b{font-size:24px}
#toast{position:fixed;left:12px;right:12px;top:64px;border-radius:14px;padding:14px 16px;z-index:20;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{display:block;animation:tin .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
#toast.ok{background:var(--green);color:#fff}
#toast.bad{background:var(--red);color:#fff}
#toast.info{background:var(--paper);color:var(--ink)}
#toast .h{font-family:'Alfa Slab One';font-size:22px}
#toast .r{font-family:'Special Elite',monospace;font-size:14px;margin-top:6px;background:rgba(0,0,0,.2);padding:6px 8px;border-radius:6px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--paper);color:var(--ink);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.item .e{font-size:34px}
.item .n{font-weight:700;font-size:15px}
.item .d{font-size:12px;opacity:.7;line-height:1.2}
.item button{background:var(--green);color:#fff;border-radius:9px;padding:6px 12px;font-weight:700;font-size:15px;margin-top:auto}
.item button:disabled{background:#999}
.vote{display:flex;flex-direction:column;gap:10px}
.vote button{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.vote button span{font-size:34px}
#off{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--red);text-align:center;padding:8px;font-weight:600;z-index:30}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="top"></div>
<div id="evbar"></div>
<main id="main"></main>
<nav class="tabs" id="tabs" style="display:none"></nav>
<div id="toast"></div>
<div id="off">Reconnecting…</div>
<div id="prank"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AVATARS = ['🦊', '🐸', '🐼', '🦄', '🐙', '🐯', '🐵', '🐧', '🦖', '🐝', '🐨', '🦁', '🐷', '🐰', '🐻', '🐮'];
const TYPE_E = { wizard: '🧙', raccoon: '🦝', ghost: '👻', robot: '🤖', grandma: '👵', vampire: '🧛', alien: '👽', kid: '🧒', pirate: '🦜' };
const MOOD = { calm: '😐 calm', angry: '😠 ANGRY', crying: '😭 CRYING' };
const FEE = { paid: '💵 paid', unpaid: '<span class="bad">🚫 UNPAID</span>', buttons: '🔘 paid in buttons' };
const INK = { pen: '🖊️ pen', crayon: '🖍️ crayon', glitter: '✨ glitter pen' };
const KIND = { deny: '❌ DENY RULE', allow: '⭐ ALWAYS APPROVE · BEATS DENY', who: '🎩 WHO MAY STAMP', scan: '🔬 MUST SCAN FIRST' };
const SCAN = { uv: { e: '🔦', n: 'UV LAMP' }, xray: { e: '🩻', n: 'X-RAY' }, id: { e: '🪪', n: 'ID CHECK' }, temp: { e: '🌡️', n: 'THERMOMETER' } };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let myId = store.get('min_id');
if (!myId) { myId = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('min_id', myId); }
let me = { name: store.get('min_name') || '', avatar: store.get('min_avatar') || '' };
const seenRules = new Set();
let ws, S = null, TRAITS = {}, taken = [], tab = 'desk', deadline = null, maxLeft = 1, recvAt = 0, busy = false, lastKey = '';

const send = m => ws?.readyState === 1 && ws.send(JSON.stringify(m));
const buzz = p => { try { navigator.vibrate?.(p); } catch {} };
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('pointerdown', wake, { once: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
const trait = t => TRAITS[t] ? `${TRAITS[t].e}` : '';
const money = n => (n < 0 ? '−$' : '$') + Math.abs(n);

let toastT;
function toast(cls, html, ms = 2600) {
  const t = $('#toast'); t.className = ''; void t.offsetWidth;
  t.innerHTML = html; t.className = 'show ' + cls;
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, ms);
}
$('#toast').onclick = () => { $('#toast').className = ''; };

// Phones join one TV's room: /play?room=ABCD (the QR code includes it).
const ROOM = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
function askRoom(msg) {
  $('#top').innerHTML = ''; $('#tabs').style.display = 'none'; $('#off').style.display = 'none';
  $('#main').innerHTML = `<div class="join"><h1>THE<br><b>MINISTRY</b></h1>
    <p style="text-align:center" class="type">${esc(msg)}</p>
    <input id="code" maxlength="4" placeholder="ROOM CODE" autocomplete="off" style="text-transform:uppercase;text-align:center;letter-spacing:.3em">
    <button class="btn" id="enter">ENTER 🏛️</button></div>`;
  const go = () => { const c = $('#code').value.toUpperCase().replace(/[^A-Z]/g, ''); if (c.length === 4) location.search = `?room=${c}`; };
  $('#enter').onclick = go;
  $('#code').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function connect() {
  if (!ROOM) return askRoom('Type the 4-letter code shown on the TV');
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=play&room=${ROOM}`);
  ws.onopen = () => { $('#off').style.display = 'none'; if (me.name) send({ t: 'join', id: myId, name: me.name, avatar: me.avatar }); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'hello') { taken = m.taken || []; TRAITS = m.traits; if (m.scanners) Object.assign(SCAN, m.scanners); if (!me.name) showJoin(); }
    else if (m.t === 'state') {
      const prevPhase = S?.phase;
      S = m.s; recvAt = Date.now();
      const nd = S.timeLeft != null ? Date.now() + S.timeLeft : null;
      if (nd && (!deadline || Math.abs(nd - deadline) > 800)) maxLeft = S.timeLeft;
      deadline = nd;
      if (S.phase !== prevPhase) { tab = S.phase === 'brief' ? 'rules' : 'desk'; busy = false; if (S.phase === 'day') buzz([80, 60, 80]); }
      render();
    }
    else if (m.t === 'result') showResult(m);
    else if (m.t === 'prank') showPrank(m.kind, m.from);
    else if (m.t === 'toast') toast('info', `<div class="h">${esc(m.text)}</div>`);
    else if (m.t === 'fx') {
      if (m.kind === 'newform') buzz(m.from ? [30, 30, 30] : 25);
      if (m.kind === 'newform' && m.from) toast('info', `<div class="h">📄 ${esc(m.from)} sent you a form!</div>`, 1800);
      if (m.kind === 'event') { buzz([60, 40, 60, 40, 120]); toast('info', `<div class="h">${esc(m.title)}</div><div class="r">${esc(m.text)}</div>`, 3500); lastKey = ''; }
      if (m.kind === 'newrule' && S?.phase === 'day') { buzz([100, 50, 100]); toast('info', `<div class="h">📢 MEMO! You got a new rule.</div><div class="r">Check your 📜 Rules tab and tell everyone!</div>`, 3500); }
    }
    else if (m.t === 'needName' || m.t === 'kicked') { me.name = ''; store.set('min_name', ''); S = null; showJoin(); }
    else if (m.t === 'noRoom') { ws.onclose = null; askRoom('No game with that code. Check the TV and try again.'); }
    else if (m.t === 'full') $('#main').innerHTML = '<div class="center"><div class="bigE">😬</div><h2>The office is full!</h2><p>Max 8 clerks.</p></div>';
  };
  ws.onclose = () => { $('#off').style.display = 'block'; setTimeout(connect, 1000); };
}

function scanHTML(f) {
  const r = f.scan || {}, out = [];
  const read = (k, html, alarm) => `<div class="readout ${alarm ? 'alarm' : ''}">${SCAN[k].e} ${html}</div>`;
  for (const k of Object.keys(SCAN)) {
    if (r[k] == null) { out.push(`<button data-scan="${k}">${SCAN[k].e} ${SCAN[k].n}</button>`); continue; }
    if (k === 'uv') out.push(read(k, `Watermark:<br><b>${esc(r.uv)}</b>`, r.uv.includes('NONE')));
    if (k === 'xray') out.push(read(k, `In the bag:<br><b>${esc(r.xray)}</b>`));
    if (k === 'id') out.push(read(k, `ID name: <b>${esc(r.id.name)}</b><br>Expires: <b>${esc(r.id.exp)}</b>`));
    if (k === 'temp') out.push(read(k, `Body temp:<br><b>${esc(r.temp)}°</b>`));
  }
  return `<div class="scanbox"><div class="lbl" style="margin:0">🔬 INSPECTION STATION · TODAY IS ${esc(S?.today || '')}</div><div class="scanrow">${out.join('')}</div></div>`;
}
function ruleHTML(r, extra = '', mega = false) {
  return `<div class="rule ${r.kind} ${r.isNew ? 'new' : ''} ${extra}"><span class="k">${KIND[r.kind]}</span>${esc(r.text)}${mega ? `<br><button class="megabtn" data-mega="${r.id}">📢 Shout it on the TV</button>` : ''}</div>`;

const decreeHTML = s => (s.decree || []).map(d => `<div class="decree">${esc(d)} <i>(beats DENY)</i></div>`).join('');
function rulesView(s) {

  if (tabsOn) {
    $('#tabs').innerHTML = tabsHTML(s);
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.tab; lastKey = ''; render(); });
  }

      else {

function showPrank(kind, from) {

// ---------- paper toss mini-game ----------
let tossState = null;
function tossHTML(s) {
  if (s.tossed) return `<div class="toss"><b>🗑️ Paper Toss</b><span class="hint">Done for today. Come back tomorrow!</span></div>`;
  return `<div class="toss"><b>🗑️ PAPER TOSS: $5 per basket</b>
    <span class="hint">Tap THROW when the 📄 is in the green zone. 3 throws!</span>
    <div class="track"><div class="zone" id="zone"></div><div class="mark" id="mark">📄</div></div>
    <div class="balls" id="balls">⚪⚪⚪</div>
    <button class="btn" id="throw" style="padding:10px;font-size:18px">▶ PLAY</button></div>`;
}
function startToss() {
  const zoneW = 18, zoneL = 20 + Math.random() * 55;
  $('#zone').style.left = zoneL + '%'; $('#zone').style.width = zoneW + '%';
  tossState = { throws: [], x: 0, dir: 1, speed: 1.6, zoneL, zoneW };
  const mark = $('#mark');
  const step = () => {
    if (!tossState || !document.body.contains(mark)) return;
    tossState.x += tossState.dir * tossState.speed;
    if (tossState.x > 100 || tossState.x < 0) tossState.dir *= -1;
    mark.style.left = tossState.x + '%';
    tossState.raf = requestAnimationFrame(step);
  };
  step();
  $('#throw').textContent = 'THROW!';
  $('#throw').onclick = () => {
    const t = tossState; if (!t || t.throws.length >= 3) return;
    const hit = t.x >= t.zoneL && t.x <= t.zoneL + t.zoneW;
    t.throws.push(hit); t.speed += 0.6; buzz(hit ? [20, 30, 60] : 80);
    $('#balls').textContent = t.throws.map(h => h ? '🗑️' : '❌').join('') + '⚪'.repeat(3 - t.throws.length);
    if (t.throws.length === 3) {
      cancelAnimationFrame(t.raf);
      const hits = t.throws.filter(Boolean).length;
      toast(hits ? 'ok' : 'bad', `<div class="h">${hits === 3 ? '🏆 PERFECT! ' : ''}${hits}/3 baskets · +$${hits * 5}</div>`, 2200);
      setTimeout(() => send({ t: 'toss', hits }), 600);
      tossState = null;
    }
  };
}

function showResult(m) {
  if (m.ok) {
    toast('ok', `<div class="h">✅ CORRECT! +$${m.pay}${m.vip ? ' ⭐' : ''}</div>${m.streak >= 3 ? `<div class="r">🔥 ${m.streak} in a row! Streak bonus included.</div>` : ''}${m.bribe ? `<div class="r">💰 +$${m.bribe} bribe pocketed. Shhh.</div>` : ''}`, m.streak >= 3 ? 2000 : 1500);
    buzz(30);
  } else {
    toast('bad', `<div class="h">❌ WRONG! −$${-m.pay}${m.vip ? ' ⭐ VIP DISASTER!' : ''}</div><div class="r">${m.why.owner ? `Broke a rule from <b>${esc(m.why.owner)}</b>:<br>` : ''}${esc(m.why.text)}</div>${m.bribe ? `<div class="r">💰 +$${m.bribe} bribe pocketed anyway…</div>` : ''}`, 3800);
    buzz([150, 60, 150]);
  }
}

function updatePat() {
  const f = S?.desk?.[0], bar = $('#patbar');
  if (!f || !bar) return;
  const p = Math.max(0, 1 - (f.age + Date.now() - recvAt) / f.patience);
  bar.style.width = p * 100 + '%';
  bar.style.background = p > .5 ? 'var(--green)' : p > .25 ? 'var(--gold)' : 'var(--red)';
}
setInterval(() => {
  updatePat();
  const ev = S?.event, evLeft = ev?.left != null ? ev.left - (Date.now() - recvAt) : null;
  const evOn = ev && S.phase === 'day' && evLeft != null && evLeft > 0;
  $('#evbar').style.display = evOn ? 'block' : 'none';
  if (evOn) $('#evbar').textContent = `${ev.title} · ${Math.ceil(evLeft / 1000)}s`;
  if (ev?.kind === 'opposite' && !evOn && S.phase === 'day' && lastKey.startsWith('deskO')) { lastKey = ''; render(); }
  const bar = $('#bar i');
  if (!deadline) { bar.style.width = '0'; return; }
  const left = Math.max(0, deadline - Date.now());
  bar.style.width = (left / maxLeft * 100) + '%';
  bar.style.background = left < 10000 ? 'var(--red)' : 'var(--gold)';
}, 250);

connect();
</script>
</body>
</html>
