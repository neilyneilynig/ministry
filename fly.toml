# Games live in memory, so this must stay a single machine (deploy with --ha=false).
app = "the-ministry-game"
primary_region = "sin"

[env]
  PUBLIC_URL = "https://the-ministry-game.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
